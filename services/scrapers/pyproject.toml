[project]
name = "scrapers"
version = "0.1.0"
description = ""
authors = [
    {name = "Server Admin"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "selenium (>=4.41.0,<5.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "fake-useragent (>=2.2.0,<3.0.0)",
    "patool (>=2.0.0,<3.0.0)",
    "selectolax (>=1.0.0,<2.0.0) ; python_version < '3.16'",
    "ftfy (>=6.3.0,<7.0.0)",
    "pdfplumber (>=0.11.0,<1.0.0)",
    "nh3 (>=0.3.0,<1.0.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "redis (>=5.0.0,<9.0.0)",
    "rq (>=2.0.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<10.0.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

; Typesense server configuration

[server]
; Data directory (matches Docker volume mount)
data-dir = /data

; API key loaded from environment variable in docker-compose
; api-key is passed via command line in docker-compose.prod.yml

; Port
api-port = 8108

; Enable CORS for API requests
enable-cors = true

; Log level
log-dir = /tmp
log-level = info
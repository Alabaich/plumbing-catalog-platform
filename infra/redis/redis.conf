# Memory limit - stays within our 256MB container limit
maxmemory 200mb

# When memory is full - remove least recently used keys
# Good for a job queue - old completed jobs get evicted first
maxmemory-policy allkeys-lru

# Persistence - save to disk so jobs survive container restarts
# Save if at least 1 key changed in last 900 seconds
save 900 1
# Save if at least 10 keys changed in last 300 seconds
save 300 10
# Save if at least 10000 keys changed in last 60 seconds
save 60 10000

# Where to store the dump file
dir /data
dbfilename dump.rdb

# Log level
loglevel notice

# Don't allow commands that could expose all keys (security)
rename-command KEYS ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Max connected clients
maxclients 50

# Disable protected mode since we're in Docker internal network
protected-mode no
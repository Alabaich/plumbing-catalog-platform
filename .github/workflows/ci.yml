name: CI

# Runs on pull requests, and is called by the Release workflow for pushes to main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; a run on main may be followed by a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff

      # Rules are in ruff.toml: errors only, no style rules.
      - name: ruff check
        run: ruff check services/api services/scrapers scripts

      - name: Byte-compile
        run: python -m compileall -q services/api services/scrapers scripts

  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as services/api/Dockerfile
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Redis is replaced by fakeredis and the DB session by a fake; tests/conftest.py
      # sets every required environment variable. No services, no network.
      - name: Run tests
        run: python -m pytest tests -q

  scraper-tests:
    name: Scraper tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scrapers
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as services/scrapers/Dockerfile
          cache: poetry
          cache-dependency-path: services/scrapers/poetry.lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      # Diff engine and LLM enrichment. The LLM is mocked; no API key, database or Redis.
      - name: Run tests
        run: poetry run python -m pytest tests -q

  remix:
    name: Remix app (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/remix-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"       # same as services/remix-app/Dockerfile
          cache: npm
          cache-dependency-path: services/remix-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck (react-router typegen + tsc --noEmit)
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, scrapers, remix-app]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
